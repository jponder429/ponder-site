<script type="text/babel">

const C = {
  bg: "#0e0c0a", bgAlt: "#141210", bgCard: "#1a1714",
  gold: "#c4a46b", goldLight: "#d9bc8a", goldFaint: "#c4a46b15",

  border: "#2e2820", borderGold: "#c4a46b35",

// ── EXAM DATA ─────────────────────────────────────────────────────────────

const lawQuestions = [
  { id:1, scenario:"A litigation associate uses an AI tool to draft a motion. The AI cites three cases — two are real, one does not exist. The associate files the motion without verifying citations.", question:"What is the primary ethical violation?", options:["Using AI tools in legal practice","Failing to supervise and verify AI-generated work before filing","Not disclosing AI use to the client","Using a non-approved vendor"], correct:1, explanation:"Competence under Model Rules requires attorneys to supervise all work product, including AI-generated content. Filing unverified citations is a candor violation." },
  { id:2, scenario:"A client asks their attorney if they can share case details with a new AI research tool that stores data on third-party servers to improve its model.", question:"What is the attorney's primary obligation before using this tool?", options:["Obtain informed client consent and assess confidentiality risks","Check whether the tool is ABA-approved","Ensure the tool has a privacy policy","Consult with the firm's IT department"], correct:0, explanation:"Model Rule 1.6 requires protecting client confidential information. Sharing data with a third-party AI system requires informed consent and a confidentiality risk assessment." },
  { id:3, scenario:"An AI contract review tool flags a clause as 'high risk' in 94% of similar contracts. The attorney relies solely on this flag to advise the client to reject the clause.", question:"What ethical principle is most at risk?", options:["Competence — the attorney must independently evaluate AI outputs","Loyalty — the attorney is prioritizing the AI over the client","Communication — the client wasn't told about the AI tool","Diligence — the attorney should have reviewed more contracts manually"], correct:0, explanation:"Attorneys must exercise independent professional judgment. Statistical AI outputs cannot substitute for legal analysis specific to the client's situation." },
  { id:4, scenario:"A law firm deploys an AI chatbot on its website that answers legal questions. The chatbot does not state it is AI, and a visitor relies on its advice without retaining the firm.", question:"Which issue is most immediately raised?", options:["Unauthorized practice of law by the AI system","Potential formation of attorney-client relationship and duty of care","GDPR violation for collecting user data","Marketing ethics — failure to disclose AI use in advertising"], correct:1, explanation:"Courts have found attorney-client relationships can form when a person reasonably believes they are receiving legal advice. An undisclosed AI chatbot creates serious duty-of-care exposure." },
  { id:5, scenario:"A public defender's office implements a recidivism prediction AI to help prioritize case resources. The model was trained on historical arrest data from a jurisdiction with documented racial disparities in policing.", question:"What is the most critical concern with this deployment?", options:["The AI may be slower than manual review","Algorithmic bias may systematically disadvantage already-marginalized clients","The vendor contract may not be properly executed","The tool has not been peer-reviewed"], correct:1, explanation:"AI models trained on biased historical data can perpetuate and amplify systemic inequities. In a public defense context, this raises equal protection and ineffective assistance concerns." },
];

const generalQuestions = [
  { id:1, scenario:"A company deploys an AI customer service agent without disclosing to customers that they are not speaking with a human.", question:"Which ethical principle is most directly violated?", options:["Efficiency — the AI is slowing response times","Transparency — users have a right to know they are interacting with AI","Privacy — customer data may be at risk","Fairness — some customers prefer human agents"], correct:1, explanation:"Transparency is a foundational AI ethics principle. Users must be able to know when they are interacting with an AI system, particularly in contexts that may affect their decisions." },
  { id:2, scenario:"An AI hiring tool trained on 10 years of employee data consistently rates candidates from certain universities significantly higher, regardless of qualifications.", question:"What type of AI failure does this represent?", options:["Technical error — the model needs retraining","Historical bias encoded into the model's training data","A calibration issue with the scoring threshold","Overfitting to recent employee data"], correct:1, explanation:"When AI models learn from historical data that reflects past human biases, they encode and often amplify those biases. This is a systemic fairness problem, not merely a technical one." },
  { id:3, scenario:"A journalist asks a company to explain why its AI system denied a customer's loan application. The company says the model is proprietary and the decision cannot be explained.", question:"What principle does this violate?", options:["Explainability — individuals affected by AI decisions have a right to meaningful explanation","Efficiency — explainable AI is slower to deploy","Accuracy — unexplainable models are less accurate","Security — explaining models exposes them to adversarial attack"], correct:0, explanation:"The right to explanation is enshrined in frameworks including the EU AI Act and GDPR. High-stakes automated decisions must be explainable to those they affect." },
  { id:4, scenario:"A tech company releases an AI model to the public before completing a bias audit, citing competitive pressure.", question:"What responsible AI principle is violated?", options:["Speed to market — the model should have launched sooner","Safety and due diligence — known risks should be assessed before deployment, not after","Transparency — the company should have announced the audit was incomplete","Fairness — the audit should be done by a third party"], correct:1, explanation:"Responsible AI development requires that foreseeable harms be assessed before deployment. Competitive pressure does not justify releasing systems with unassessed risk." },
  { id:5, scenario:"An organization's AI ethics policy states: 'We are committed to responsible AI.' The policy has no implementation guidelines, no audit schedule, and no accountability structure.", question:"What does this represent?", options:["A solid foundation — detailed policies can be added over time","Ethics washing — aspirational statements without operationalization provide no meaningful protection","An appropriate starting point for a pre-revenue organization","This is standard practice in the industry"], correct:1, explanation:"Ethics washing occurs when organizations adopt the language of responsible AI without the structures to implement it. Meaningful AI governance requires specific commitments, measurable practices, and clear accountability." },
];

const examData = {

          {Object.entries(examData).map(([key, exam]) => (
            <div key={key} onClick={() => onStart(key)}
              style={{ background:"#fff", border:"1px solid #e0d0b8", borderTop:`4px solid ${exam.color}`, borderRadius:6, padding:26, cursor:"pointer", textAlign:"left", boxShadow:"0 2px 16px rgba(90,60,20,0.09)", transition:"transform 0.2s, box-shadow 0.2s" }}
              onMouseEnter={e => { e.currentTarget.style.transform="translateY(-2px)"; e.currentTarget.style.boxShadow="0 6px 28px rgba(90,60,20,0.15)"; }}
              onMouseLeave={e => { e.currentTarget.style.transform="none"; e.currentTarget.style.boxShadow="0 2px 16px rgba(90,60,20,0.09)"; }}>
              <div style={{ marginBottom:10 }}><Chip label={exam.title} color={exam.color} /></div>
              <div style={{ fontFamily:"'Playfair Display',Georgia,serif", fontWeight:700, fontSize:18, color:"#1a1410", marginBottom:6 }}>{exam.subtitle}</div>
              <div style={{ color:"#6b5a40", fontSize:13, lineHeight:1.65, marginBottom:18 }}>{exam.description}</div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:"#a89070", borderTop:"1px solid #e0d0b8", paddingTop:10 }}>
                <span>5 questions</span><span>Pass: 70%</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ExamQuestion({ examKey, onComplete, onBack }) {
  const exam = examData[examKey];
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [answers, setAnswers] = useState([]);
  const q = exam.questions[current];
  const progress = (current / exam.questions.length) * 100;

  const handleNext = () => {
    const newAnswers = [...answers, { correct: selected === q.correct }];
    if (current + 1 >= exam.questions.length) onComplete(newAnswers);
    else { setAnswers(newAnswers); setCurrent(current+1); setSelected(null); setRevealed(false); }
  };

  return (
    <div style={{ minHeight:"100vh", background:"#faf6ef", display:"flex", flexDirection:"column" }}>
      <div style={{ background:"#fff", borderBottom:"1px solid #e0d0b8", padding:"14px 32px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <Logo size="sm" />
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <Chip label={exam.title} color={exam.color} />
          <span style={{ color:"#6b5a40", fontSize:13 }}>Question {current+1} of {exam.questions.length}</span>
        </div>
        <button onClick={onBack} style={{ background:"transparent", border:"none", color:"#6b5a40", cursor:"pointer", fontSize:20 }}>✕</button>
      </div>
      <div style={{ height:4, background:"#e0d0b8" }}>
        <div style={{ height:"100%", width:`${progress}%`, background:exam.color, transition:"width 0.4s ease" }} />
      </div>
      <div style={{ flex:1, padding:"36px 24px", display:"flex", justifyContent:"center" }}>
        <div style={{ width:"100%", maxWidth:680 }}>
          <div style={{ background:exam.colorBg, border:`1px solid ${exam.color}30`, borderLeft:`4px solid ${exam.color}`, borderRadius:6, padding:"18px 22px", marginBottom:24 }}>
            <div style={{ color:exam.color, fontSize:9, letterSpacing:"0.16em", textTransform:"uppercase", fontFamily:"'DM Mono',monospace", marginBottom:6, fontWeight:600 }}>Scenario</div>
            <p style={{ color:"#3a2e20", fontSize:15, lineHeight:1.8, margin:0 }}>{q.scenario}</p>
          </div>
          <div style={{ fontFamily:"'Playfair Display',Georgia,serif", fontWeight:700, fontSize:19, color:"#1a1410", marginBottom:20, lineHeight:1.4 }}>{q.question}</div>
          <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:24 }}>
            {q.options.map((opt, idx) => {
              let bg="#fff", border="#e0d0b8", color="#3a2e20", bl="transparent";
              if (revealed) {
                if (idx===q.correct) { bg="#eaf4ea"; border="#3a7a3a"; color="#3a7a3a"; bl="#3a7a3a"; }
                else if (idx===selected && idx!==q.correct) { bg="#f9ecea"; border="#8a2e20"; color="#8a2e20"; bl="#8a2e20"; }
                else { color="#a89070"; }
              } else if (idx===selected) { border=exam.color; bg=exam.colorBg; bl=exam.color; }
              return (
                <div key={idx} onClick={() => !revealed && setSelected(idx)}
                  style={{ background:bg, border:`1px solid ${border}`, borderLeft:`4px solid ${revealed||idx===selected?bl||border:"#e0d0b8"}`, borderRadius:6, padding:"14px 18px", cursor:revealed?"default":"pointer", color, fontSize:14, lineHeight:1.6, display:"flex", alignItems:"flex-start", gap:12, transition:"all 0.15s" }}>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, minWidth:20, paddingTop:1, fontWeight:700 }}>{String.fromCharCode(65+idx)}.</span>
                  <span>{opt}</span>
                </div>
              );
            })}
          </div>
          {revealed && (
            <div style={{ background:"#fdfaf5", border:"1px solid #e0d0b8", borderRadius:6, padding:"16px 20px", marginBottom:20 }}>
              <div style={{ color:"#b8943f", fontSize:9, letterSpacing:"0.16em", textTransform:"uppercase", fontFamily:"'DM Mono',monospace", marginBottom:6, fontWeight:600 }}>Why this matters</div>
              <p style={{ color:"#3a2e20", fontSize:14, lineHeight:1.75, margin:0 }}>{q.explanation}</p>
            </div>
          )}
          {!revealed
            ? <button onClick={() => selected!==null && setRevealed(true)} disabled={selected===null} style={{ width:"100%", padding:"14px", background:selected!==null?exam.color:"#e0d0b8", color:selected!==null?"#fff":"#a89070", border:"none", borderRadius:6, cursor:selected!==null?"pointer":"not-allowed", fontFamily:"'Playfair Display',Georgia,serif", fontWeight:700, fontSize:16, transition:"background 0.2s" }}>Check Answer</button>
            : <button onClick={handleNext} style={{ width:"100%", padding:"14px", background:exam.color, color:"#fff", border:"none", borderRadius:6, cursor:"pointer", fontFamily:"'Playfair Display',Georgia,serif", fontWeight:700, fontSize:16 }}>{current+1>=exam.questions.length?"View Results →":"Next Question →"}</button>
          }
        </div>
      </div>
    </div>
  );
}

function ExamResults({ examKey, answers, onRetake, onHome, onBackToSite }) {
  const exam = examData[examKey];
  const correct = answers.filter(a => a.correct).length;
  const pct = Math.round((correct/answers.length)*100);
  const passed = pct >= exam.passMark;
  return (
    <div style={{ minHeight:"100vh", background:"#faf6ef", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:40 }}>
      <div style={{ width:"100%", maxWidth:520, textAlign:"center" }}>
        <div style={{ marginBottom:24 }}><Logo size="lg" /></div>
        <div style={{ width:140, height:140, borderRadius:"50%", border:`5px solid ${passed?"#3a7a3a":"#8a2e20"}`, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", margin:"0 auto 24px", background:passed?"#eaf4ea":"#f9ecea" }}>
          <div style={{ fontFamily:"'Playfair Display',Georgia,serif", fontWeight:800, fontSize:42, color:passed?"#3a7a3a":"#8a2e20", lineHeight:1 }}>{pct}%</div>
          <div style={{ fontSize:12, color:"#6b5a40", marginTop:4 }}>{correct}/{answers.length} correct</div>
        </div>
        <div style={{ marginBottom:12 }}><Chip label={passed?"Credential Earned":"Not Yet Passed"} color={passed?"#3a7a3a":"#8a2e20"} /></div>
        <h2 style={{ fontFamily:"'Playfair Display',Georgia,serif", fontWeight:800, fontSize:28, color:"#1a1410", margin:"0 0 10px" }}>{passed?"Congratulations.":"Keep Going."}</h2>
        <p style={{ color:"#6b5a40", fontSize:15, lineHeight:1.75, margin:"0 0 28px", fontFamily:"'Cormorant Garamond',Georgia,serif", fontStyle:"italic" }}>
          {passed ? `You've demonstrated practitioner-level AI ethics competency in ${exam.title}.` : `You scored ${pct}% — a passing score of ${exam.passMark}% is required.`}
        </p>
        {passed && (
          <div style={{ background:"#fff", border:"1px solid #c9a84c", borderTop:`4px solid #b8943f`, borderRadius:6, padding:"20px 24px", marginBottom:24, textAlign:"left" }}>
            <div style={{ color:"#b8943f", fontSize:9, letterSpacing:"0.16em", textTransform:"uppercase", fontFamily:"'DM Mono',monospace", marginBottom:8, fontWeight:600 }}>Credential Issued</div>
            <div style={{ fontFamily:"'Playfair Display',Georgia,serif", fontWeight:700, fontSize:18, color:"#3a2e20", marginBottom:4 }}>{exam.credential}</div>
            <div style={{ color:"#6b5a40", fontSize:12 }}>Valid 2 years · Issued {new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
          </div>
        )}
        <div style={{ display:"flex", gap:10, marginBottom:12 }}>
          <button onClick={onRetake} style={{ flex:1, padding:"12px", background:"transparent", border:"1px solid #e0d0b8", color:"#6b5a40", borderRadius:6, cursor:"pointer", fontFamily:"inherit", fontSize:14 }}>Retake</button>
          <button onClick={onHome} style={{ flex:1, padding:"12px", background:exam.color, color:"#fff", border:"none", borderRadius:6, cursor:"pointer", fontFamily:"'Playfair Display',Georgia,serif", fontWeight:700, fontSize:14 }}>Try Another</button>
        </div>
        <button onClick={onBackToSite} style={{ width:"100%", padding:"12px", background:"transparent", border:`1px solid ${C.borderGold}`, color:C.gold, borderRadius:6, cursor:"pointer", fontFamily:"'Cormorant Garamond',Georgia,serif", fontStyle:"italic", fontSize:15 }}>← Back to Ponder</button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────

function App() {
  const [page, setPage] = useState("landing");
  const [examScreen, setExamScreen] = useState("home");
  const [activeExam, setActiveExam] = useState(null);
  const [results, setResults] = useState(null);

  const goToExam = () => { setPage("exam"); setExamScreen("home"); setActiveExam(null); setResults(null); };
  const startExam = (key) => { setActiveExam(key); setResults(null); setExamScreen("question"); };
  const backToExamHome = () => { setExamScreen("home"); setActiveExam(null); setResults(null); };

  if (page === "landing") return <Landing onDemo={goToExam} />;

  if (page === "exam") {
    if (examScreen === "home") return <ExamHome onStart={startExam} onBack={() => setPage("landing")} />;
    if (examScreen === "question") return <ExamQuestion examKey={activeExam} onComplete={r => { setResults(r); setExamScreen("results"); }} onBack={backToExamHome} />;
    if (examScreen === "results") return <ExamResults examKey={activeExam} answers={results} onRetake={() => startExam(activeExam)} onHome={backToExamHome} onBackToSite={() => setPage("landing")} />;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
