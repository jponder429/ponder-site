<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ponder. — PoC Analytics</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230e0c0a'/%3E%3Ctext x='4' y='26' font-family='Georgia%2C serif' font-weight='800' font-size='22' fill='%23f0ebe3'%3EP%3C/text%3E%3Ctext x='20' y='26' font-family='Georgia%2C serif' font-weight='800' font-size='22' fill='%23c4a46b'%3E.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cormorant+Garamond:ital@1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#0e0c0a;color:#f0ebe3;-webkit-font-smoothing:antialiased;min-height:100vh}
.playfair{font-family:'Playfair Display',Georgia,serif}
.mono{font-family:'DM Mono',monospace}

/* Gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
#gate-box{width:100%;max-width:380px;text-align:center}
.gate-logo{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:36px;color:#f0ebe3;margin-bottom:8px}
.gate-logo span{color:#c4a46b}
.gate-sub{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8a8070;margin-bottom:40px}
.gate-input{width:100%;padding:14px 18px;background:#1a1714;border:1px solid #2e2820;border-radius:2px;color:#f0ebe3;font-size:16px;font-family:Georgia,serif;letter-spacing:.1em;margin-bottom:12px;outline:none;transition:border-color .2s}
.gate-input:focus{border-color:#c4a46b}
.gate-input::placeholder{color:#4a4035;letter-spacing:.05em}
.gate-btn{width:100%;padding:14px;background:#c4a46b;color:#0e0c0a;border:none;border-radius:2px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;transition:background .2s}
.gate-btn:hover{background:#d9bc8a}
.gate-error{color:#c4704a;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;margin-top:10px;display:none}

/* Dashboard */
#dashboard{display:none;min-height:100vh}
.top-bar{background:#141210;border-bottom:1px solid #2e2820;padding:18px 40px;display:flex;justify-content:space-between;align-items:center}
.top-logo{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:22px;color:#f0ebe3}
.top-logo span{color:#c4a46b}
.top-right{display:flex;align-items:center;gap:16px}
.live-badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c4a46b;background:#c4a46b18;border:1px solid #c4a46b35;padding:4px 10px;border-radius:2px}
.refresh-btn{padding:7px 16px;background:transparent;border:1px solid #2e2820;color:#8a8070;border-radius:2px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;letter-spacing:.08em;transition:all .2s}
.refresh-btn:hover{border-color:#8a8070;color:#f0ebe3}
.signout-btn{padding:7px 16px;background:transparent;border:1px solid #2e2820;color:#8a8070;border-radius:2px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;letter-spacing:.08em}

.content{max-width:1000px;margin:0 auto;padding:40px}

.section-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c4a46b;margin-bottom:6px}
.page-title{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:32px;color:#f0ebe3;margin-bottom:6px}
.page-sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;color:#8a8070;margin-bottom:40px}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.stat-card{background:#141210;border:1px solid #2e2820;border-radius:4px;padding:22px 20px;text-align:center}
.stat-val{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;color:#c4a46b;line-height:1;margin-bottom:6px}
.stat-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8a8070}
.card{background:#141210;border:1px solid #2e2820;border-radius:4px;padding:24px 28px;margin-bottom:16px}
.card-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#c4a46b;margin-bottom:20px}
.bar-bg{height:7px;background:#1a1714;border-radius:4px}
.bar-fill{height:100%;background:#c4a46b;border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #2e2820}
.row:last-child{border-bottom:none}
.chip-pass{display:inline-block;padding:2px 9px;border-radius:2px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #7a5c2e;color:#c4a46b;background:#c4a46b15}
.chip-fail{display:inline-block;padding:2px 9px;border-radius:2px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #8a2e20;color:#c4704a;background:#c4704a15}

.empty{text-align:center;padding:60px 28px}
.empty-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:22px;color:#3a3028;margin-bottom:10px}
.empty-sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;color:#4a4035}

@media(max-width:640px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .content{padding:24px 16px}
  .top-bar{padding:14px 20px}
}
</style>
</head>
<body>

<!-- Gate -->
<div id="gate">
  <div id="gate-box">
    <div class="gate-logo">Ponder<span>.</span></div>
    <div class="gate-sub">PoC Analytics · Internal</div>
    <input type="password" class="gate-input" id="pw-input" placeholder="Enter passphrase" onkeydown="if(event.key==='Enter')checkPw()"/>
    <button class="gate-btn" onclick="checkPw()">Access Analytics</button>
    <div class="gate-error" id="pw-error">Incorrect passphrase. Try again.</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="top-bar">
    <div class="top-logo">Ponder<span>.</span> &nbsp;<span style="font-family:'DM Mono',monospace;font-size:11px;color:#8a8070;font-weight:400">PoC Analytics</span></div>
    <div class="top-right">
      <span class="live-badge">Live Data</span>
      <button class="refresh-btn" onclick="renderAnalytics()">↻ Refresh</button>
      <button class="signout-btn" onclick="signOut()">Sign Out</button>
    </div>
  </div>
  <div class="content">
    <div class="section-eyebrow">The Present Company — Internal</div>
    <div class="page-title">PoC Research Dashboard</div>
    <div class="page-sub">Real usage data from the Ponder demo. Not visible to the public.</div>
    <div id="analytics-content"></div>
  </div>
</div>

<script>
const PASS = "ponder2026";
const AK = "ponder_poc_analytics";
const SESSION_KEY = "ponder_analytics_auth";

function checkPw() {
  const val = document.getElementById('pw-input').value.trim();
  if (val === PASS) {
    sessionStorage.setItem(SESSION_KEY, "1");
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderAnalytics();
  } else {
    const err = document.getElementById('pw-error');
    err.style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    setTimeout(() => err.style.display = 'none', 3000);
  }
}

function signOut() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pw-input').value = '';
}

// Auto-login if session active
if (sessionStorage.getItem(SESSION_KEY) === "1") {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

function loadAttempts() {
  try { const r = localStorage.getItem(AK); return r ? (JSON.parse(r).attempts || []) : []; } catch { return []; }
}

const examNames = { law: "Law", general: "General" };

function renderAnalytics() {
  const attempts = loadAttempts();
  const el = document.getElementById('analytics-content');

  if (!attempts.length) {
    el.innerHTML = `<div class="card empty"><div class="empty-title">No data yet</div><div class="empty-sub">Once someone completes a demo exam, their data will appear here.</div></div>`;
    return;
  }

  const total = attempts.length;
  const passed = attempts.filter(a => a.passed).length;
  const completed = attempts.filter(a => a.completed).length;
  const avgScore = Math.round(attempts.reduce((s, a) => s + a.pct, 0) / total);
  const passRate = Math.round((passed / total) * 100);
  const compRate = Math.round((completed / total) * 100);
  const avgDur = attempts.filter(a => a.durationMs).length
    ? Math.round(attempts.filter(a => a.durationMs).reduce((s, a) => s + a.durationMs, 0) / attempts.filter(a => a.durationMs).length / 60000)
    : null;

  // By vertical
  const byV = {};
  for (const a of attempts) {
    if (!byV[a.examKey]) byV[a.examKey] = { count: 0, passed: 0 };
    byV[a.examKey].count++;
    if (a.passed) byV[a.examKey].passed++;
  }
  const maxC = Math.max(...Object.values(byV).map(v => v.count));

  // Per-question
  const qMap = {};
  for (const a of attempts) {
    for (const qa of (a.questions || [])) {
      const k = `${a.examKey}::${qa.id}`;
      if (!qMap[k]) qMap[k] = { examKey: a.examKey, id: qa.id, correct: 0, total: 0, ms: 0 };
      qMap[k].total++;
      if (qa.correct) qMap[k].correct++;
      qMap[k].ms += qa.timeMs || 0;
    }
  }
  const qList = Object.values(qMap).map(q => ({
    ...q,
    rate: Math.round((q.correct / q.total) * 100),
    avgSec: Math.round(q.ms / q.total / 1000)
  })).sort((a, b) => a.rate - b.rate);

  const hardest = qList.slice(0, 5);
  const recent = attempts.slice(0, 15);

  // Question labels (short map)
  const qLabels = {
    law: {1:"Unverified citations",2:"Third-party AI tool",3:"AI contract flag",4:"AI chatbot disclosure",5:"Recidivism prediction",6:"Discovery omission",7:"AI-drafted will",8:"Hallucinated statute",9:"Unvetted tool",10:"AI billing rounding",11:"Fabricated citations",12:"AI outcome prediction",13:"Client email analysis",14:"Free AI tool ToS",15:"AI intake scoring"},
    general: {1:"Undisclosed AI agent",2:"Biased hiring tool",3:"Zip code proxy",4:"AI accountability",5:"Unexplainable denial",6:"Dialect moderation bias",7:"Sentencing AI trade secret",8:"Scraped training data",9:"Selective human override",10:"Pre-audit release",11:"Buried ToS disclosure",12:"Behavioral proxy bias",13:"Predictive policing",14:"Fairness metrics",15:"Ethics washing"}
  };

  const vertBars = Object.entries(byV).map(([k, v]) => {
    const pct = maxC ? Math.round((v.count / maxC) * 100) : 0;
    const pr = Math.round((v.passed / v.count) * 100);
    return `<div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="color:#f0ebe3;font-size:14px">${examNames[k] || k}</span>
        <span style="color:#8a8070;font-size:12px;font-family:'DM Mono',monospace">${v.count} attempts · ${pr}% pass</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  const hardestRows = hardest.length ? hardest.map((q, i) => {
    const label = qLabels[q.examKey]?.[q.id] || `Q${q.id}`;
    return `<div class="row">
      <div>
        <div style="color:#f0ebe3;font-size:13px;margin-bottom:3px">${examNames[q.examKey] || q.examKey} · Q${q.id}: ${label}</div>
        <div style="font-family:'DM Mono',monospace;font-size:11px;color:#8a8070">${q.total} attempts · avg ${q.avgSec}s</div>
      </div>
      <div style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:22px;color:${q.rate < 40 ? '#c4704a' : '#8a8070'};min-width:48px;text-align:right">${q.rate}%</div>
    </div>`;
  }).join('') : `<div style="color:#4a4035;font-size:13px;font-family:'DM Mono',monospace">Complete more exams to surface question data.</div>`;

  const recentRows = recent.map((a, i) => {
    const dur = a.durationMs ? `${Math.round(a.durationMs / 60000)}m` : '';
    const date = a.ts ? new Date(a.ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
    return `<div class="row">
      <div>
        <div style="color:#f0ebe3;font-size:14px">${examNames[a.examKey] || a.examKey} · Associate</div>
        <div style="font-family:'DM Mono',monospace;font-size:11px;color:#8a8070">${date}${dur ? ' · ' + dur : ''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:20px;color:${a.passed ? '#c4a46b' : '#c4704a'}">${a.pct}%</div>
        <span class="${a.passed ? 'chip-pass' : 'chip-fail'}">${a.passed ? 'Pass' : 'Fail'}</span>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="grid-4">
      <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-label">Total Attempts</div></div>
      <div class="stat-card"><div class="stat-val">${compRate}%</div><div class="stat-label">Completion Rate</div></div>
      <div class="stat-card"><div class="stat-val">${passRate}%</div><div class="stat-label">Pass Rate</div></div>
      <div class="stat-card"><div class="stat-val">${avgScore}%</div><div class="stat-label">Avg Score</div></div>
    </div>
    ${avgDur ? `<div style="font-family:'DM Mono',monospace;font-size:11px;color:#8a8070;margin-bottom:28px;letter-spacing:.08em">Avg time to complete: ${avgDur} min</div>` : ''}
    <div class="grid-2">
      <div class="card"><div class="card-label">Attempts by Vertical</div>${vertBars}</div>
      <div class="card"><div class="card-label">Hardest Questions</div>${hardestRows}</div>
    </div>
    <div class="card"><div class="card-label">Recent Attempts</div>${recentRows}</div>
  `;

  // Update timestamp
  const ts = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  document.querySelector('.page-sub').textContent = `Real usage data from the Ponder demo. Last refreshed ${ts}.`;
}

// Init
if (sessionStorage.getItem(SESSION_KEY) === "1") renderAnalytics();
</script>
</body>
</html>
